name: Announce release to Discord

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release info
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EV_NAME: ${{ github.event.release.name }}
          EV_BODY: ${{ github.event.release.body }}
          EV_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$EV_TAG" ]; then
            TITLE="$EV_NAME"; TAG="$EV_TAG"; printf '%s' "$EV_BODY" > body.txt
          else
            TAG=$(gh release view -R "$REPO" --json tagName -q .tagName)
            TITLE=$(gh release view -R "$REPO" --json name -q .name)
            gh release view -R "$REPO" --json body -q .body > body.txt
          fi
          echo "title=${TITLE:-Blackout Toolz $TAG}" >> "$GITHUB_OUTPUT"

      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TITLE: ${{ steps.rel.outputs.title }}
        run: |
          BODY=$(cat body.txt)
          payload=$(jq -n \
            --arg t "🟣 $TITLE is out" \
            --arg d "${BODY:-A new version of Blackout Toolz is available.}" \
            '{username:"Blackout Toolz",
              embeds:[{title:$t,
                       description:($d[0:4000]),
                       color:10170623,
                       footer:{text:"Open Blackout Toolz and click Update to get it."}}]}')
          curl -sS -X POST -H "content-type: application/json" -d "$payload" "$WEBHOOK"
